<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--dp-bg); }
  html, body, #app { max-width: 100%; overflow-x: clip; }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  ::selection { background: var(--dp-highlight-bg); }
  @keyframes dp-toast-in { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes dp-toast-progress { from { width: 100%; } to { width: 0%; } }
  @keyframes dp-modal-in { from { transform: translateY(16px) scale(0.98); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
  @keyframes dp-shimmer { 0% { background-position: -300px 0; } 100% { background-position: 300px 0; } }

  button { cursor: pointer; transition: transform .2s ease, box-shadow .2s ease, filter .2s ease, opacity .2s ease; }
  button:hover { filter: brightness(1.07); }
  button:active { transform: scale(0.96); }
  a { transition: opacity .2s ease; }
  a:hover { opacity: .75; }
  input, textarea, select { transition: border-color .2s ease, box-shadow .2s ease; }
  [role="button"] { transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease; }
  [role="button"]:focus-visible, button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--dp-cyan-500);
    outline-offset: 2px;
  }
  .dp-card {
    transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  }
  .dp-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 14px 28px -14px rgba(17,31,63,0.22);
    border-color: #0E93D855 !important;
  }
  .dp-card:active { transform: translateY(-1px); }
  .dp-row-card {
    transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  }
  .dp-row-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 28px -16px rgba(17,31,63,0.22);
    border-color: #0E93D855 !important;
  }
  .dp-table-row { transition: background .2s ease; }
  .dp-table-row:hover { background: rgba(120,148,190,0.1); }
  .dp-tooltip-target { position: relative; }
  .dp-tooltip-target .dp-tooltip {
    position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%) translateX(-4px);
    background: #111F3F; color: #F2F7FD; font-size: 12px; font-weight: 700; white-space: nowrap;
    padding: 6px 10px; border-radius: 8px; pointer-events: none; z-index: 60;
    opacity: 0; transition: opacity .1s ease, transform .1s ease;
    box-shadow: 0 8px 20px -8px rgba(0,0,0,0.4);
  }
  .dp-tooltip-target:hover .dp-tooltip, .dp-tooltip-target:focus-visible .dp-tooltip {
    opacity: 1; transform: translateY(-50%) translateX(0);
  }
  .dp-skeleton {
    background: linear-gradient(90deg, rgba(148,163,184,0.15) 25%, rgba(148,163,184,0.3) 37%, rgba(148,163,184,0.15) 63%);
    background-size: 600px 100%;
    animation: dp-shimmer 1.4s ease-in-out infinite;
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.45); border-radius: 999px; }
  ::-webkit-scrollbar-track { background: transparent; }

  @keyframes dp-fade-in { from { opacity: 0; } to { opacity: 1; } }
  .dp-view-enter { animation: dp-fade-in .18s ease-out; }
  .dp-table-scroll { overflow-x: auto; }
  .dp-admin-card { min-width: 0; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      scroll-behavior: auto !important;
      transition-duration: .01ms !important;
    }
  }

  @media (max-width: 720px) {
    .dp-admin-layout { padding: 14px 12px 40px !important; }
    .dp-admin-card { grid-template-columns: 1fr !important; }  }
</style>
